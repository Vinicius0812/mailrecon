[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailrecon"
version = "0.1.0"
description = "Educational email recon CLI focused on public-source validation and reporting."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Vinicius Araujo" }
]
dependencies = [
  "click>=8.0,<9.0",
  "typer>=0.12,<0.26",
  "httpx>=0.27,<1.0",
  "email-validator>=2.1,<3.0",
  "dnspython>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-cov>=5.0,<8.0",
  "ruff>=0.17,<0.18"
]

[project.scripts]
mailrecon = "mailrecon.main:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["mailrecon"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 85

[tool.ruff]
target-version = "py311"
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = [
  "E501",  # translation catalogs keep long bilingual strings on one line
  "B008",  # typer.Option()/typer.Argument() defaults are the documented Typer pattern
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
