[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mailrecon"
version = "0.1.0"
description = "Educational email recon CLI focused on public-source validation and reporting."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Vinicius Araujo" }
]
dependencies = [
  "typer>=0.12,<1.0",
  "httpx>=0.27,<1.0",
  "email-validator>=2.1,<3.0",
  "dnspython>=2.6,<3.0",
  "python-dotenv>=1.0,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0"
]

[project.scripts]
mailrecon = "mailrecon.main:run"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
