name: MailRecon Synthetic Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.13']
    env:
      PYTHON_DOTENV_DISABLED: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install editable and build tooling
        run: python -m pip install -e ".[dev]" build wheel "setuptools>=68"
      - name: Offline test suite
        run: python scripts/run_offline_tests.py -q
      - name: Synthetic API benchmark
        run: python -m mailrecon.benchmark
      - name: Build wheel and source distribution
        run: python -m build --no-isolation
      - name: Installed wheel smoke
        run: python scripts/package_smoke.py
      - name: Diff whitespace check
        run: git diff --check
